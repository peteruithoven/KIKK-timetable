services:
  app:
    container_name: "kikk-timetable"
    build: .
    restart: unless-stopped
    # NUXT_SUPABASE_* and NUXT_TRAIL_SUPABASE_*, see .env.example.
    env_file: .env
    ports:
      - ${NODE_PORT}:3000
    volumes:
      # Favorites and the last fetched schedule. Survives restarts and rebuilds.
      - data:/app/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/events').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 1m
      timeout: 10s
      start_period: 20s

volumes:
  data:
