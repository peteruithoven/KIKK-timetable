<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · KIKK 2026 Timetable</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Shown by the service worker for pages that weren't saved for offline use. -->
    <style>
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #fff;
        color: #121212;
        font-family: "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      p.eyebrow {
        margin: 0;
        color: #737373;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.25rem 0 1rem;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1rem;
        background: #121212;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      }
      /* The app's dark mode colors, see app/assets/css/main.css. */
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #f0f0f0;
        }
        p.eyebrow {
          color: #a3a3a3;
        }
        a {
          background: #f0f0f0;
          color: #121212;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">KIKK Festival 2026</p>
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet. The timetable is available offline.</p>
      <a href="/">Open the timetable</a>
    </main>
  </body>
</html>
