# Temporary: takes the screenshots for PR #12 and commits them to the branch. Removed before merging.
name: PR screenshots

on:
  push:
    branches: [mobile-filter-popover]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Start the dev server
        run: |
          nohup vp run dev > dev.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/ || (cat dev.log; exit 1)

      - name: Take screenshots
        run: |
          mkdir -p ~/pptr shots
          (cd ~/pptr && npm init -y > /dev/null && npm i puppeteer-core)
          cp .github/pr-screenshots/shots.mjs ~/pptr/
          node ~/pptr/shots.mjs "$PWD/shots" || (tail -50 dev.log; exit 1)

      - name: Pair light and dark
        run: |
          pip install --quiet pillow
          python3 .github/pr-screenshots/pair.py shots .github/pr-screenshots/out

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr-screenshots/out
          git commit -m "Screenshots for PR #12 (temporary)"
          git push
